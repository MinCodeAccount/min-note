<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Min-Note 管理画面</title>
  </head>
  <body>
    <!-- Clear Service Workers aggressively to ensure Sveltia CMS version changes bypass local caching -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister().then(function(boolean) {
              console.log("Service Worker unregistered: " + boolean);
            });
          }
        });
      }
    </script>
    <!-- Sveltia CMS (Decap CMSのモダン/サーバーレス版。GitHub PATにネイティブ対応) -->
    <!-- v0.144.0 (March 4) is stable. parameter t added to bypass browser cache -->
    <script src="https://unpkg.com/@sveltia/cms@0.144.0/dist/sveltia-cms.js?t=resetcache_20260314"></script>

    <script>
      // 1. YouTube埋め込み用のカスタム部品
      CMS.registerEditorComponent({
        id: "youtube",
        label: "📺 YouTube 埋め込み",
        fields: [{name: 'id', label: 'YouTube動画 (URL、埋め込みタグ全体、または動画ID)', widget: 'string', required: false, default: ''}],
        pattern: /^<div class="youtube-wrapper"><iframe src="https:\/\/www\.youtube\.com\/embed\/(.*?)" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen><\/iframe><\/div>$/,
        fromBlock: function(match) {
          return { id: match[1] };
        },
        toBlock: function(obj) {
          let videoId = obj.id || '';
          
          // ユーザーがiframe全体を貼り付けた場合
          if (videoId.includes('<iframe') && videoId.includes('src=')) {
              const srcMatch = videoId.match(/src="[^"]*?(?:embed\/|v=)([^"&?]+)/);
              if (srcMatch) videoId = srcMatch[1];
          } 
          // ユーザーがURLを貼り付けた場合 (watch?v=... や youtu.be/...)
          else if (videoId.includes('youtube.com') || videoId.includes('youtu.be')) {
              const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
              const match = videoId.match(regExp);
              if (match && match[2].length === 11) {
                  videoId = match[2];
              }
          }
          
          // 万が一余計な文字列が紛れ込んだ場合、最初の11文字(YouTube IDの標準長)だけを切り出す安全処理
          if (videoId.length > 11 && !videoId.includes('<')) {
              videoId = videoId.substring(0, 11);
          }

          return '<div class="youtube-wrapper"><iframe src="https://www.youtube.com/embed/' + videoId + '" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>';
        },
        toPreview: function(obj) {
          return '<div style="background:#ddd; padding:20px; text-align:center;">YouTube動画プレビュー枠: ' + (obj.id || '') + '</div>';
        }
      });

      // 2. 自前アップロードしたMP4動画の埋め込み用カスタム部品
      CMS.registerEditorComponent({
        id: "video",
        label: "🎬 動画アップロード (MP4等)",
        fields: [{name: 'url', label: '動画を選択・アップロードしてください', widget: 'file', required: false, default: ''}],
        pattern: /^<video controls src="(.*?)" style="max-width: 100%; border-radius: 8px; margin: 1em 0;"><\/video>$/,
        fromBlock: function(match) {
          return { url: match[1] };
        },
        toBlock: function(obj) {
          return '<video controls src="' + obj.url + '" style="max-width: 100%; border-radius: 8px; margin: 1em 0;"></video>';
        },
        toPreview: function(obj) {
          return '<video controls src="' + obj.url + '" style="max-width: 100%; border-radius: 8px; margin: 1em 0;"></video>';
        }
      });
      // 3. Twitter (X) 埋め込み用のカスタム部品
      CMS.registerEditorComponent({
        id: "twitter",
        label: "🐦 Twitter (X) 埋め込み",
        fields: [
            {name: 'url', label: 'ツイートのURL (またはTwitter公式の「埋め込み」HTMLコード全体)', widget: 'string', required: false, default: ''},
            {name: 'video', label: '動画専用レイアウト (Embedded Video)', widget: 'boolean', required: false, default: true}
        ],
        pattern: /(<blockquote class="twitter-tweet".*?<\/blockquote>|<a class="twitter-timeline".*?<\/a>)/s,
        fromBlock: function(match) {
          const raw = match[0] || match[1] || '';
          const isVideo = raw.includes('data-media-max-width');
          let url = '';
          const statusMatch = raw.match(/href="(https:\/\/(?:twitter|x)\.com\/[^/]+\/status\/[^"]+)"/);
          if (statusMatch) {
              url = statusMatch[1];
          } else {
              const anyMatch = raw.match(/href="(https:\/\/(?:twitter|x)\.com\/[^"]+)"/);
              if (anyMatch) url = anyMatch[1];
          }
          return { url: url, video: isVideo };
        },
        toBlock: function(obj) {
          let cleanUrl = obj.url || '';
          
          // ユーザーがHTML全体を貼った場合、そこから /status/ を含むURLを優先抽出
          const htmlMatch = cleanUrl.match(/href="(https:\/\/(?:twitter|x)\.com\/[^/]+\/status\/[^"]+)"/);
          if (htmlMatch) {
              cleanUrl = htmlMatch[1];
          } else {
              // 単なるURLのベタ貼りか、Timelineなどの場合
              const htmlMatchOther = cleanUrl.match(/href="(https:\/\/(?:twitter|x)\.com\/[^"]+)"/);
              if (htmlMatchOther) {
                  cleanUrl = htmlMatchOther[1];
              }
          }

          // 不要なパラメータや引用符を除去
          cleanUrl = cleanUrl.split('"')[0].split("'")[0];

          if (cleanUrl.includes('/status/')) {
              // 単体のツイート
              if (obj.video) {
                  return '<blockquote class="twitter-tweet" data-media-max-width="560"><a href="' + cleanUrl + '"></a></blockquote>';
              } else {
                  return '<blockquote class="twitter-tweet"><a href="' + cleanUrl + '"></a></blockquote>';
              }
          } else if (cleanUrl.trim() !== '') {
              // ハッシュタグやプロフィールのタイムライン
              return '<a class="twitter-timeline" data-height="600" href="' + cleanUrl + '">Twitter Timeline</a>';
          } else {
              return '';
          }
        },
        toPreview: function(obj) {
          return '<div style="background:#ddd; padding:20px; text-align:center;">Twitter (X) プレビュー枠: ' + (obj.url || '') + (obj.video ? ' (動画サイズ制限あり)' : '') + '</div>';
        }
      });
      // 4. 日経電子版 (Nikkei) 記事埋め込み用のカスタム部品
      CMS.registerEditorComponent({
        id: "nikkei",
        label: "📰 日経電子版 (ブログカード) 埋め込み",
        fields: [{name: 'url', label: '日経電子版の記事URL (例: https://www.nikkei.com/article/DGXZQO...)', widget: 'string', required: false, default: ''}],
        pattern: /<iframe src="(https:\/\/www\.nikkei\.com\/.*?\/embed|https:\/\/hatenablog-parts\.com\/embed\?url=https:\/\/www\.nikkei\.com\/.*?)"[^>]*><\/iframe>/,
        fromBlock: function(match) {
          let extractedUrl = match[1];
          // 過去の壊れた /embed URL もしなやかに吸収・復元する
          if (extractedUrl.startsWith('https://hatenablog-parts.com/embed?url=')) {
              extractedUrl = extractedUrl.replace('https://hatenablog-parts.com/embed?url=', '');
          } else if (extractedUrl.endsWith('/embed')) {
              extractedUrl = extractedUrl.replace(/\/embed$/, '');
          }
          return { url: extractedUrl };
        },
        toBlock: function(obj) {
          let targetUrl = obj.url || '';
          if (targetUrl) {
              // 余計なパラメータ (?xxx) を削る
              targetUrl = targetUrl.split('?')[0];
          }
          // 直接iframe埋め込みは日経のセキュリティ(X-Frame-Options)で弾かれるため、
          // はてなブログパーツのOGPカード生成APIをプロキシとして利用し、リッチリンクカード化する
          return '<iframe src="https://hatenablog-parts.com/embed?url=' + targetUrl + '" frameborder="0" scrolling="no" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" style="width:100%; height:160px; max-width:600px; border:none; border-radius:8px; margin: 1em 0;"></iframe>';
        },
        toPreview: function(obj) {
          return '<div style="background:#f5f5f5; border:1px solid #ccc; padding:20px; text-align:center; margin: 1em 0; border-radius:8px;">📰 日経 リッチリンクカード プレビュー枠<br><small>' + (obj.url || '') + '</small></div>';
        }
      });
    </script>
  </body>
</html>
